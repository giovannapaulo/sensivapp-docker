<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SensivApp - Diário de Sintomas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f0f6;
            color: #4a4046;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(180, 160, 190, 0.15);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2, h3 {
            color: #6c5b7b;
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #5c505c;
        }
        select, textarea, button {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dcd6df;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, textarea:focus {
            border-color: #99839c;
        }
        button {
            background-color: #99839c;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #826c83;
        }
        #listaSintomas {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        .sintoma-item {
            background-color: #faf7fa;
            border-left: 4px solid #99839c;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .badge-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-leve { background-color: #a8d5ba; }
        .dot-moderado { background-color: #ffb3ba; }
        .dot-intenso { background-color: #ff6f69; }
    </style>
</head>
<body>
<div class="container">
    <h2>SensivApp - Diário de Sintomas</h2>
    <form id="formSintoma">
        <label for="intensidade">Intensidade do Sintoma:</label>
        <select id="intensidade" required>
            <option value="Leve">Leve</option>
            <option value="Moderado">Moderado</option>
            <option value="Intenso">Intenso</option>
        </select>

        <label for="descricao">Descrição / Detalhes:</label>
        <textarea id="descricao" rows="3" placeholder="Como você está se sentindo hoje?" required></textarea>

        <button type="submit">Salvar Registro</button>
    </form>

    <h3>Registros Salvos no Banco:</h3>
    <div id="listaSintomas">Carregando...</div>
</div>

<script>
    const API_URL = ""; 

    function getDotClass(intensidade) {
        const val = intensidade.toLowerCase();
        if (val.includes('leve')) return 'dot-leve';
        if (val.includes('moderado')) return 'dot-moderado';
        if (val.includes('intenso')) return 'dot-intenso';
        return 'dot-leve';
    }

    async function carregarSintomas() {
        try {
            const res = await fetch(`${API_URL}/sintomas/`);
            const data = await res.json();
            const div = document.getElementById("listaSintomas");
            if (data.length === 0) {
                div.innerHTML = "<p>Nenhum registro encontrado.</p>";
                return;
            }
            div.innerHTML = data.map(s => `
                <div class="sintoma-item">
                    <div class="badge-container">
                        <span class="dot ${getDotClass(s.intensidade)}"></span>
                        <span><strong>Intensidade:</strong> ${s.intensidade}</span>
                    </div><br>
                    <span style="display: block; margin-top: 6px;"><strong>Descrição:</strong> ${s.descricao}</span>
                </div>
            `).join("");
        } catch (e) {
            document.getElementById("listaSintomas").innerHTML = "<p style='color:#ff6961;'>Erro ao conectar com a API.</p>";
        }
    }

    document.getElementById("formSintoma").addEventListener("submit", async (e) => {
        e.preventDefault();
        const intensidade = document.getElementById("intensidade").value;
        const descricao = document.getElementById("descricao").value;

        await fetch(`${API_URL}/sintomas/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ intensidade, descricao })
        });

        document.getElementById("descricao").value = "";
        carregarSintomas();
    });

    carregarSintomas();
</script>
</body>
</html>
