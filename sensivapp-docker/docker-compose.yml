version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sensivdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sensiv_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: sensiv-api:latest
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sensivdb
    networks:
      - sensiv_net
    depends_on:
      - db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  frontend:
    image: sensiv-frontend:latest
    networks:
      - sensiv_net
    depends_on:
      - api
    ports:
      - "3000:80"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sensiv_net
    deploy:
      placement:
        constraints: [node.role == manager]

volumes:
  pgdata:

networks:
  sensiv_net:
    driver: overlay
